<header class="site-header py-3 mb-4 border-bottom">
  <div class="container d-flex justify-content-between align-items-center">

    <!-- Logo -->
    <h1 class="logo m-0">
      <a href="{% url 'shop:product_list' %}" class="text-decoration-none text-dark">
        Makeup Shop
      </a>
    </h1>

    <!-- Navigation + Search + User -->
    <div class="d-flex align-items-center gap-4">

      <!-- Navigation Links -->
      <nav class="nav-links d-flex align-items-center gap-4">
        <a href="{% url 'shop:product_list' %}" class="nav-link">Home</a>
        <a href="{% url 'shop:cart_detail' %}" class="nav-link">Cart</a>

        {% if user.is_authenticated %}
          <span class="text-muted">Hello, {{ user.username }}!</span>
          <a href="{% url 'shop:logout' %}" class="nav-link">Logout</a>
        {% else %}
          <a href="{% url 'shop:login' %}" class="nav-link">Login</a>
        {% endif %}
      </nav>

      <!-- Search Form -->
      <form method="get" action="{% url 'shop:product_list' %}" class="d-flex" role="search">
        <input class="form-control me-2" type="search" placeholder="Search products" name="q" aria-label="Search">
        <button class="btn btn-outline-success" type="submit">Search</button>
      </form>

    </div>

  </div>
</header>
